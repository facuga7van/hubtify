name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Only the newest run per branch/PR matters — cancel the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Test / Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 must be compiled against the Electron ABI:
      # the test suite runs under `electron` (ELECTRON_RUN_AS_NODE=1).
      - name: Rebuild native modules
        run: npm run rebuild

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck shared-logic (no electron/node/dom)
        run: npm run typecheck:shared-logic

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  android-build:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # The runner ships an SDK in $ANDROID_HOME; make sure the exact platform
      # and build-tools from android/variables.gradle are there.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Install dependencies
        run: npm ci

      # mobile:sync = vite build (dist/mobile) + versionName/versionCode from
      # package.json + `cap sync android`. No signing here: debug key.
      - name: Build web and sync android
        run: npm run mobile:sync

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
