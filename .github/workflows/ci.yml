name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Only the newest run per branch/PR matters — cancel the rest.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck / Test / Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 must be compiled against the Electron ABI:
      # the test suite runs under `electron` (ELECTRON_RUN_AS_NODE=1).
      - name: Rebuild native modules
        run: npm run rebuild

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck shared-logic (no electron/node/dom)
        run: npm run typecheck:shared-logic

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
